# Styles, their colours, and the instruments a track can put in the spotlight.
# Order of styles = order in the filters and clockwise round the record.
styles:
  - Alternative
  - Progressive
  - Electronic
  - Ambient

style_colours:
  Alternative: "#ff8a65"
  Progressive: "#b39dff"
  Electronic:  "#4dd8ff"
  Ambient:     "#9be7b9"

accents:
  Guitar:   { name: Guitar,      colour: "#ff9100" }
  Vox:      { name: Vocals,      colour: "#00e5ff" }
  Keys:     { name: Keys,        colour: "#d500f9" }
  Drums:    { name: Drums,       colour: "#ff1744" }
  Bass:     { name: Bass,        colour: "#00e676" }
  Flute:    { name: Flute,       colour: "#ffee58" }
  Electric: { name: Electronics, colour: "#2979ff" }
