# Styles, their colours, and the instruments a track can put in the spotlight.
# Order of styles = order in the filters and clockwise round the record.
styles:
  - Alternative
  - Progressive
  - Electronic
  - Ambient

style_colours:
  Alternative: "#ff8a65"
  Progressive: "#b39dff"
  Electronic:  "#4dd8ff"
  Ambient:     "#9be7b9"

accents:           # id → display name (ru: the Russian one) + colour
  Guitar:   { name: Guitar,      ru: Гитара,       colour: "#ff9100" }
  Vox:      { name: Vocals,      ru: Вокал,        colour: "#00e5ff" }
  Keys:     { name: Keys,        ru: Клавишные,    colour: "#d500f9" }
  Drums:    { name: Drums,       ru: Барабаны,     colour: "#ff1744" }
  Bass:     { name: Bass,        ru: Бас,          colour: "#00e676" }
  Flute:    { name: Flute,       ru: Флейта,       colour: "#ffee58" }
  Electric: { name: Electronics, ru: Электроника,  colour: "#2979ff" }
